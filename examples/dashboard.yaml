# Example dashboard (raw configuration editor). These are my three radars; swap in your own
# radar_name values, spots (map % of your floorplan image) and room outlines.
title: Radar setup
views:
- title: Calibrate
  path: calibrate
  cards:
  - type: custom:rmm-calibrate-card
    image: /local/images/floorplan.png
    map_group: default
    radars:
    - name: ld2450_tracker
      label: Bedroom
      spots:
      - x: 5.9
        y: 86.2
        t: Window corner by the bedhead wall
        d: Stand about half a metre out from both walls.
      - x: 17.7
        y: 84.6
        t: Bedside, window side
        d: Beside the pillow end of the bed, window side.
      - x: 5.9
        y: 72
        t: Middle of the window
        d: Half a metre back from the window glass.
      - x: 36.6
        y: 86.2
        t: Bathroom-wall corner by the bedhead wall
        d: Half a metre out from both walls.
      - x: 37.8
        y: 72.8
        t: Bathroom doorway, bedroom side
        d: Stand just in front of the bathroom door, in the bedroom.
      - x: 49
        y: 84.5
        t: Bathroom sink (check)
        d: 'Stand at the sink. Check only: shows where this radar puts you in the bathroom, without bending its fit.'
        check: true
      - x: 59.6
        y: 86
        t: Toilet, sitting (check)
        d: Sit on the toilet. Check only, same as the sink.
        check: true
